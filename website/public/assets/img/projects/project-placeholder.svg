<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGradient)" />

  <!-- Blueprint Grid Overlay -->
  <rect width="800" height="500" fill="url(#grid)" />

  <!-- Ambient Glow Circles -->
  <circle cx="400" cy="230" r="180" fill="#3b82f6" opacity="0.08" filter="blur(40px)" />
  <circle cx="350" cy="200" r="90" fill="#6366f1" opacity="0.12" filter="blur(30px)" />

  <!-- Geometric Frame Corner Accents -->
  <path d="M 40 70 L 40 40 L 70 40" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <path d="M 760 70 L 760 40 L 730 40" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <path d="M 40 430 L 40 460 L 70 460" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <path d="M 760 430 L 760 460 L 730 460" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- Icon Container Circle -->
  <circle cx="400" cy="200" r="48" fill="rgba(30, 41, 59, 0.8)" stroke="url(#accentGrad)" stroke-width="2" />

  <!-- Lightning / Engineering Icon -->
  <path d="M 404 174 L 388 200 L 400 200 L 396 226 L 414 198 L 402 198 Z" fill="url(#accentGrad)" />

  <!-- Heading -->
  <text x="400" y="280" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="1">
    GLOBSOL ENGINEERING PROJECT
  </text>

  <!-- Subtitle -->
  <text x="400" y="310" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" letter-spacing="0.5">
    Site Photography &amp; Project Media Being Updated
  </text>

  <!-- Subtle Badge -->
  <rect x="330" y="340" width="140" height="28" rx="14" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1" />
  <text x="400" y="358" text-anchor="middle" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">
    33kV • SOLAR • EPC
  </text>
</svg>
