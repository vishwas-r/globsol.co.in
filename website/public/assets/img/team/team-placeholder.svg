<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#edf2f7" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3763eb" />
      <stop offset="100%" stop-color="#6f58e8" />
    </linearGradient>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#cbd5e1" stroke-width="0.5" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="350" fill="url(#bgGrad)" />
  <rect width="400" height="350" fill="url(#gridPattern)" />

  <!-- Subtle Brand Backdrop Glow -->
  <circle cx="200" cy="155" r="90" fill="url(#accentGrad)" opacity="0.08" />

  <!-- Avatar Figure -->
  <g transform="translate(0, 10)">
    <!-- Head -->
    <circle cx="200" cy="120" r="48" fill="url(#avatarGrad)" />
    
    <!-- Torso / Suit Shoulders -->
    <path d="M 120 280 C 120 215, 155 195, 200 195 C 245 195, 280 215, 280 280 Z" fill="url(#avatarGrad)" />
    
    <!-- Collar / Tie Accent -->
    <path d="M 188 196 L 200 230 L 212 196 Z" fill="#ffffff" opacity="0.9" />
    <path d="M 197 215 L 203 215 L 204 250 L 200 256 L 196 250 Z" fill="url(#accentGrad)" />
  </g>

  <!-- Bottom Accent Line -->
  <line x1="160" y1="315" x2="240" y2="315" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" opacity="0.7" />
</svg>
